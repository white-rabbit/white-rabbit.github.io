{{ with .Get "id" }}
{{- $uid := printf "ws-%d" now.UnixNano -}}
<div id="{{ $uid }}" class="wheel-sim-host"
     style="position: relative; height: 500px; box-shadow: 0px 5px 10px rgb(0, 175, 255); margin: 10px 0; background: #000; border-radius: 4px; overflow: hidden;">
  <button type="button" class="wheel-sim-load" data-src="{{ . }}"
    style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(15,23,42,0.85); color: #cbd5e1; border: 1px dashed rgba(203,213,225,0.4); cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif; padding: 16px; text-align: center;">
    <span data-label style="font-size: 18px; font-weight: 600; color: #e2e8f0;">Load wheel simulation</span>
    <span style="font-size: 12px; opacity: 0.7;">~20 MB WASM &middot; click to start</span>
  </button>
  <canvas id="mygame-canvas"
    style="position: absolute; inset: 0; width: 100%; height: 100%; display: none;"></canvas>
</div>
<script type="module">
  const host = document.getElementById("{{ $uid }}");
  const btn = host.querySelector(".wheel-sim-load");
  const canvas = host.querySelector("canvas");
  const label = btn.querySelector("[data-label]");
  btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    label.textContent = "Loading\u2026";
    try {
      const mod = await import(btn.dataset.src);
      await mod.default();
      canvas.style.display = "block";
      btn.remove();
    } catch (err) {
      console.error("[wheel-sim] failed to load", err);
      label.textContent = "Failed to load - click to retry";
      btn.disabled = false;
    }
  });
</script>
{{ end }}
